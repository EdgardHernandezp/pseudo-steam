spring.application.name=pseudo-steam
server.port=8081

# AWS
aws.region=sa-east-1
aws.bucket.policy.accessKeyId=${PSEUDO_STEAM_BUCKET_POLICY_ACCESS_KEY}
aws.bucket.policy.secretAccessKey=${PSEUDO_STEAM_BUCKET_POLICY_SECRET_ACCESS_KEY}
aws.identity.policy.accessKeyId=${PSEUDO_STEAM_IDENTITY_POLICY_ACCESS_KEY}
aws.identity.policy.secretAccessKey=${PSEUDO_STEAM_IDENTITY_POLICY_SECRET_ACCESS_KEY}
aws.account=${AWS_ACCOUNT}

aws.access.grant.wuser.access.key=${WUSER_ACCESS_KEY}
aws.access.grant.wuser.secret.access.key=${WUSER_SECRET_ACCESS_KEY}
aws.access.grant.ruser.access.key=${RUSER_ACCESS_KEY}
aws.access.grant.ruser.secret.access.key=${RUSER_SECRET_ACCESS_KEY}

access.point.user.access.key=${ACCESS_POINT_USER_ACCESS_KEY}
access.point.user.secret.key=${ACCESS_POINT_USER_SECRET_ACCESS_KEY}